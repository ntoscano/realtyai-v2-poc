version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: telehealth-matching-postgres
    ports:
      - '54324:5432'
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: docker
      POSTGRES_DB: telehealth_matching
    volumes:
      - telehealth_pgdata:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  telehealth_pgdata:
