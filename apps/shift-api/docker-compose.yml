version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: shift-marketplace-postgres
    ports:
      - '54323:5432'
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: docker
      POSTGRES_DB: shift_marketplace
    volumes:
      - shift_pgdata:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  shift_pgdata:
